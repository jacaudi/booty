version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  TIMESTAMP:
    sh: git log -1 --format=%cI 2>/dev/null || echo unknown
  IMAGE: booty:dev
  PLATFORMS: linux/amd64,linux/arm64
  # go-tricorder is not published yet: lint builds its plugin from a local checkout. Override
  # with the environment (TRICORDER_DIR=/path/to/go-tricorder task lint). Drop with the `path:`
  # line in .custom-gcl.yml once a tag exists.
  TRICORDER_DIR:
    sh: echo "${TRICORDER_DIR:-{{.ROOT_DIR}}/../go-tricorder}"

tasks:
  web:
    desc: Build the web UI into web/dist (embedded by the Go build)
    dir: web
    cmds:
      - npm ci
      - npm run build

  build:
    desc: Build bin/booty (static, stripped, version-stamped)
    deps: [web]
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}} -X main.timestamp={{.TIMESTAMP}}" -o bin/booty ./cmd

  run:
    desc: Build and run against ./data
    deps: [build]
    cmds:
      - bin/booty --dataDir=data/

  test:
    desc: Go tests (race) and web tests
    cmds:
      - go test -race ./...
      - task: test:web

  test:web:
    dir: web
    cmds:
      - npm ci
      - npx tsc -b
      - npm test

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - test -z "$(gofmt -l $(git ls-files '*.go'))"

  lint:bin:
    desc: Build bin/custom-gcl, golangci-lint with the go-tricorder plugin (only when its inputs change)
    method: timestamp
    dir: bin/custom-gcl-build
    sources:
      - "{{.ROOT_DIR}}/.custom-gcl.yml"
      - "{{.TRICORDER_DIR}}/go.mod"
      - "{{.TRICORDER_DIR}}/go.sum"
      - "{{.TRICORDER_DIR}}/**/*.go"
    generates:
      - "{{.ROOT_DIR}}/bin/custom-gcl"
    preconditions:
      - sh: test -d "{{.TRICORDER_DIR}}"
        msg: "go-tricorder checkout not found at {{.TRICORDER_DIR}}: clone it there or set TRICORDER_DIR=/path/to/go-tricorder (see docs/development.md)"
      - sh: command -v golangci-lint
        msg: "install golangci-lint v2 to build bin/custom-gcl (see docs/development.md)"
    cmds:
      # destination in the rendered file is ".." so the binary lands in bin/. Clones golangci-lint
      # over the network, which is why sources/generates skip the build when nothing changed.
      - sed "s#@TRICORDER_DIR@#$(cd "{{.TRICORDER_DIR}}" && pwd)#" "{{.ROOT_DIR}}/.custom-gcl.yml" > .custom-gcl.yml
      - golangci-lint custom

  lint:
    desc: Lint the whole tree with bin/custom-gcl (existing findings are known and not yet fixed; see docs/development.md)
    deps: [lint:bin]
    cmds:
      - bin/custom-gcl run ./...

  lint:new:
    desc: Lint code changed since origin/main (must be clean)
    deps: [lint:bin]
    cmds:
      - bin/custom-gcl run --new-from-merge-base=origin/main ./...

  vuln:
    desc: govulncheck against the repo's toolchain
    preconditions:
      - sh: command -v govulncheck
        msg: "install govulncheck: GOBIN=$HOME/go/bin go install golang.org/x/vuln/cmd/govulncheck@v1.9.0"
    cmds:
      - govulncheck ./...

  ipxe:
    desc: Rebuild the embedded iPXE binaries in boot/ (container, or IPXE_NATIVE=1)
    cmds:
      - go generate ./boot/

  check:ipxe:
    desc: Verify boot/ binaries against SHA256SUMS
    cmds:
      - go test ./boot/

  clean:
    desc: Remove build outputs
    cmds:
      - rm -rf bin web/dist/assets web/dist/index.html

  image:
    desc: Build the container image
    cmds:
      - docker build --build-arg BOOTY_VERSION={{.VERSION}} --build-arg BOOTY_TIMESTAMP={{.TIMESTAMP}} -t {{.IMAGE}} .

  image:smoke:
    desc: Build the image for this machine's arch and smoke-test it (binary arch matches, booty starts, /healthz, /version.json and /ui/ answer)
    deps: [image]
    vars:
      NAME: booty-smoke
      PORT: '18080'
    cmds:
      - docker rm -f {{.NAME}} >/dev/null 2>&1 || true
      - defer: docker rm -f {{.NAME}} >/dev/null 2>&1 || true
      # The binary must be built for the image's platform (an amd64 binary once shipped in the arm64 image).
      - |
        want=$(docker image inspect -f '{{"{{"}}.Architecture{{"}}"}}' {{.IMAGE}})
        docker create --name {{.NAME}} {{.IMAGE}} >/dev/null
        mkdir -p bin
        docker cp {{.NAME}}:/booty bin/booty-smoke
        docker rm {{.NAME}} >/dev/null
        got=$(go version -m bin/booty-smoke | awk '$1=="build" && sub(/^GOARCH=/, "", $2) {print $2}')
        rm -f bin/booty-smoke
        echo "image arch: $want, binary GOARCH: $got"
        test "$want" = "$got"
      # Bridge networking, so this runs on macOS too; TFTP and proxyDHCP are not exercised.
      - docker run -d --name {{.NAME}} -p 127.0.0.1:{{.PORT}}:8080 --tmpfs /data {{.IMAGE}} --dataDir=/data >/dev/null
      - |
        for i in $(seq 1 30); do
          curl -fsS http://127.0.0.1:{{.PORT}}/healthz >/dev/null 2>&1 && break
          if [ "$(docker inspect -f '{{"{{"}}.State.Running{{"}}"}}' {{.NAME}})" != true ]; then docker logs {{.NAME}}; exit 1; fi
          sleep 1
        done
        curl -fsS http://127.0.0.1:{{.PORT}}/healthz >/dev/null || { docker logs {{.NAME}}; exit 1; }
        curl -fsS http://127.0.0.1:{{.PORT}}/version.json
        echo
        curl -fsS -o /dev/null http://127.0.0.1:{{.PORT}}/ui/
        echo "smoke test passed"

  image:push:
    deps: [image]
    cmds:
      - docker push {{.IMAGE}}

  image:buildx:
    desc: Multi-arch image build
    cmds:
      - docker buildx build --platform {{.PLATFORMS}} --build-arg BOOTY_VERSION={{.VERSION}} --build-arg BOOTY_TIMESTAMP={{.TIMESTAMP}} -t {{.IMAGE}} .

  image:run:
    desc: Run the image with the least privileges booty needs (host networking for TFTP/proxyDHCP/ARP, NET_BIND_SERVICE and NET_RAW only)
    deps: [image]
    cmds:
      - docker run -ti --rm --cap-drop ALL --cap-add NET_BIND_SERVICE --cap-add NET_RAW -v {{.ROOT_DIR}}/data:/data --network host {{.IMAGE}} --debug=true --dataDir=/data
